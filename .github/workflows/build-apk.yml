name: Build Lambda APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable
        working-directory: Lambda-Android2/Lambda
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: Lambda-Android2/Lambda
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lambda-debug-apk
          path: Lambda-Android2/Lambda/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
